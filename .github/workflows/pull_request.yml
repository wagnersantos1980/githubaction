name: Pull Request

on: [pull_request]

jobs:
    install:
        name: Instalar Pacotes
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v3
            
            - name: Cache node_modules
              uses: actions/cache@v2
              with:
                path: node_modules
                key: ${{runner.os}}-${{hashFiles('**/package-lock.json')}}

            - name: Instalar Dependencias
              run: npm ci